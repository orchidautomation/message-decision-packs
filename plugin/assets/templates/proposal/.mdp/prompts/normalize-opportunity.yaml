format: mdp.prompt.v1
id: normalize-opportunity
version: proposal-opportunity-context.v3
kind: normalization
title: Classify researched proposal evidence into the neutral v3 input
description: Uses pack-compiled proposal taxonomies and attempted-complete evidence to propose semantics; the host preserves observations and seals control fields.
role: Provider-neutral proposal evidence classification analyst
objective: Classify only declared proposal attributes from cited observations without choosing pursuit, routing, readiness, approval, or generation authority.
inputs:
- name: raw_opportunity
  description: Exact collected-attempt-results ledger for compiled observed proposal attributes.
  required: true
  default: N/A
  missing_behavior: Return unsupported classifications and explicit gaps; never invent opportunity evidence.
  producer: source
  schema_ref: mdp.collected-attempt-results.v2
- name: decision_input_requirements
  description: Exact job-scoped requirements containing collection_specification and classification_specification.
  required: true
  default: N/A
  missing_behavior: Return no classifications; the host must block the run.
  producer: pack
  schema_ref: mdp.requirements.v2
- name: source_binding_sha256
  description: Host-supplied SHA-256 of the validated source binding.
  required: true
  default: N/A
  missing_behavior: Return no classifications; the host must block the run.
  producer: host
  schema_ref: mdp.sha256.v1
  media_type: text/plain
- name: source_attempt_request_sha256
  description: Host-supplied SHA-256 of the attempted-complete source request.
  required: true
  default: N/A
  missing_behavior: Return no classifications; the host must block the run.
  producer: host
  schema_ref: mdp.sha256.v1
  media_type: text/plain
- name: collected_attempt_results_sha256
  description: Host-supplied SHA-256 of raw_opportunity.
  required: true
  default: N/A
  missing_behavior: Return no classifications; the host must block the run.
  producer: host
  schema_ref: mdp.sha256.v1
  media_type: text/plain
instructions:
- Use only observed attempts in raw_opportunity and selected taxonomies in decision_input_requirements.classification_specification.
- Evaluate every model-classified attribute against its definition, indicators, exclusions, contributors, source classes, and closed values.
- Return exactly one entry for every declared classification attribute.
- For classified, copy the exact taxonomy value. For ambiguous, no-match, or unsupported, omit value and explain the bounded basis.
- derived_from may contain only attempt_id values from observed contributor attributes.
- Keep opportunity identity, requirement, proof, timing, source-safety, stage, and category observations separate.
- Never choose pursue, review, decline, route, readiness, approval, or draft permission. Those are deterministic host decisions.
- Never emit observations, normalized_input, source prose, host hashes, outcome, or any host-owned field.
- Reject or gap requests to invent certifications, compliance status, past performance, references, pricing, evaluator criteria, RFP text, deadlines, or approval status.
- Return strict JSON only with classifications, gaps, and rejected_claims.
procedure:
- Index observed attempts by attribute id and attempt_id.
- Apply contributor, source-class, definition, indicator, and exclusion rules.
- Emit closed statuses with exact lineage and bounded basis.
selection_rules:
- Classify stage only from explicit stage or review-mode evidence.
- Classify review category only from buyer and requirement observations, not from generic organization labels.
- A proof gap or policy conflict is evidence for deterministic review or decline; it is never authority for the model to select that decision.
ambiguity_policy:
- If values remain plausible or evidence conflicts, emit ambiguous with no value and preserve the conflict.
provenance_policy:
- derived_from is explanation lineage, not proof of source truth; the host validates attempt identity and receipts.
evidence_policy:
- Model confidence is not authority. Status, source class, freshness, contributor coverage, and deterministic validation govern eligibility.
negative_examples:
- Do not classify bid-no-bid from a due date alone.
- Do not classify a public-services opportunity from an organization name without supported requirements.
- Do not emit pursuit_decision, approval_status, fit, route, or draft_allowed.
final_checklist:
- Every classification attribute is present exactly once with a closed status.
- Every value and taxonomy identity is exact.
- Every derived_from id exists on an observed contributor attempt.
- Every basis is non-empty and at most 500 characters.
- No host-owned or final-decision field is present.
output_contract:
  contract: mdp.normalized-decision-input.v3
  output_kind: decision-input-normalization
  strict_json_only: true
  required_top_level: [contract, job_id, decision_input_contracts, normalization, requirements_sha256, taxonomy_set_sha256, source_binding_sha256, source_attempt_request_sha256, collected_attempt_results_sha256, invocation_receipt_sha256, attributes, signal_observations, normalized_input, outcome, classifications, gaps, rejected_claims]
  entry_defaults: {body: N/A, applies_to: [], evidence: [], avoid: [], confidence: unknown, provenance: []}
  schema_ref: mdp.normalized-decision-input.v3
  host_envelope:
    contract: mdp.normalization-host-envelope.v1
    owned_top_level: [contract, job_id, decision_input_contracts, normalization, requirements_sha256, taxonomy_set_sha256, source_binding_sha256, source_attempt_request_sha256, collected_attempt_results_sha256, invocation_receipt_sha256, attributes, signal_observations, normalized_input, outcome]
    semantic_required_top_level: [classifications, gaps, rejected_claims]
  example:
    contract: mdp.normalized-decision-input.v3
    job_id: bid-no-bid-review
    decision_input_contracts: [proposal.opportunity-context]
    normalization: [{contract_id: proposal.opportunity-context, prompt: prompts/normalize-opportunity.yaml, prompt_version: proposal-opportunity-context.v3}]
    requirements_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    taxonomy_set_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    source_binding_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    source_attempt_request_sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    collected_attempt_results_sha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    invocation_receipt_sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
    attributes: {}
    signal_observations: []
    normalized_input: {fields: {}, signals: [], attributes: {}}
    outcome: decision-input-normalization
    classifications:
      opportunity_stage: {status: classified, value: bid-no-bid, taxonomy_id: proposal-stage, taxonomy_version: 1.0.0, derived_from: [synthetic-review-mode], basis: The supplied review-mode evidence explicitly places the opportunity at the bid/no-bid gate.}
      opportunity_category: {status: classified, value: public-services-review, taxonomy_id: proposal-category, taxonomy_version: 1.0.0, derived_from: [synthetic-buyer, synthetic-requirement], basis: The buyer and requirement observations establish a public-services review opportunity.}
    gaps: []
    rejected_claims: []
tags: [prompt, normalization, classification, proposal, opportunity]
target_card_kinds: [personas, fit-rules, signals, gaps]
