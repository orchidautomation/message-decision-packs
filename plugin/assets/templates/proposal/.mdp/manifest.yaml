    output_path: attributes.opportunity_stage
    value: {type: string, enum: [early-review, bid-no-bid, compliance-review, proof-review, red-team-review]}
    requirement: required
    decision_effects: [readiness, routing, gaps, human-review, no-draft]
    source_classes: []
    provenance: {required: false, required_fields: []}
    confidence: {required: false, minimum: 0}
    freshness: {required: false, max_age_days: 0, allow_unknown: true}
    sensitivity: customer-private
    status_behavior: {}
  - id: buyer_context_observation
    processing: observed
    question: What bounded source-backed buyer or agency context is supported?
    output_path: attributes.buyer_context_observation
    value: {type: string}
    requirement: required
    decision_effects: [readiness, fit, routing, brief, gaps, no-draft]
    source_classes: [user_provided, customer_system, reviewed_internal, public_web, synthetic_fixture]
