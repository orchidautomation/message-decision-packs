    value: {type: string, enum: [none, present]}
    requirement: hard-gate
    decision_effects: [readiness, disqualification, routing, gaps, human-review, no-draft]
    source_classes: [user_provided, customer_system, reviewed_internal, synthetic_fixture]
    provenance: {required: true, required_fields: [attempt_id, source_class, source_locator, observed_at]}
    confidence: {required: true, minimum: 80}
    freshness: {required: true, max_age_days: 365, allow_unknown: false}
    sensitivity: restricted
    status_behavior: {observed: evaluate, not_found: block, not_applicable: block, blocked: human-review, error: human-review}
  - id: source_safety
    processing: observed
    question: What reviewed source-handling classification applies to this opportunity evidence?
    output_path: attributes.source_safety
    value: {type: string, enum: [synthetic, sanitized, private-scratch, public-source, user-approved-local]}
    requirement: hard-gate
    decision_effects: [readiness, disqualification, routing, gaps, human-review, no-draft]
    source_classes: [user_provided, customer_system, reviewed_internal, synthetic_fixture]
    provenance: {required: true, required_fields: [attempt_id, source_class, source_locator, observed_at]}
    confidence: {required: true, minimum: 80}
    freshness: {required: true, max_age_days: 365, allow_unknown: false}
