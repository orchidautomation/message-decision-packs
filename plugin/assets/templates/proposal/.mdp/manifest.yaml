  - id: opportunity_category
    processing: model-classified
    classification_taxonomy: {id: proposal-category, version: 1.0.0}
    question: Which pack-owned review category is supported by the buyer and requirement evidence?
    output_path: attributes.opportunity_category
    value: {type: string, enum: [municipal-modernization, public-services-review]}
    requirement: required
    decision_effects: [readiness, fit, routing, brief, gaps, human-review, no-draft]
    source_classes: []
    provenance: {required: false, required_fields: []}
    confidence: {required: false, minimum: 0}
    freshness: {required: false, max_age_days: 0, allow_unknown: true}
