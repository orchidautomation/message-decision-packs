lead_input_requirements:
  required_fields:
  - company
  - company_domain
  - trigger
  - background
  - segment
  - signals
  - synthetic
  required_signal_fields:
  - source
  required_attributes:
  - source_safety
  - review_mode_observation
  - opportunity_stage
  - buyer_context_observation
  - requirement_observation
  - opportunity_category
  - proof_status
  - policy_conflict_status
  value_contracts:
    segment:
      type: string
      enum:
      - municipal-modernization
      - public-services-review
      description: Proposal profile segment labels accepted from opportunity normalization prompts.
    source_kind:
      type: string
      enum:
      - user-provided-opportunity
      - private-scratch-opportunity
      - public-source
      - sanitized-example
      - synthetic-example
      description: Public-safe or local-only source markers accepted from opportunity normalization prompts.
  attribute_definitions:
    opportunity_stage:
      type: string
      enum:
      - early-review
      - bid-no-bid
      - compliance-review
      - proof-review
      - red-team-review
      description: Reviewed proposal stage label emitted by normalize-opportunity.
    opportunity_category:
      type: string
      enum:
      - municipal-modernization
      - public-services-review
      description: Pack-owned review category classified from separate buyer and requirement observations.
    review_mode_observation:
      type: string
      description: Bounded observed stage or review-mode evidence; not a pack-owned classification.
    buyer_context_observation:
      type: string
      description: Bounded observed buyer or agency context used for proposal-category classification.
    requirement_observation:
      type: string
      description: Bounded observed requirement used for proposal-category classification and deterministic review.
    proof_observation:
      type: string
      description: Optional bounded approved proof, proof gap, or unsupported proof request.
    proof_status:
      type: string
      enum:
      - approved
      - gap
      - unsupported
      - not-required
      description: Reviewed direct proof state consumed by deterministic pursuit policy.
    policy_conflict_observation:
      type: string
      description: Optional bounded policy, compliance, privacy, or approval conflict used by deterministic policy.
    policy_conflict_status:
      type: string
      enum:
      - none
      - present
      description: Reviewed direct policy-conflict state consumed by deterministic pursuit policy.
    pursuit_decision:
      type: string
      enum:
      - proceed
      - pause
      - decline
      - needs-more-info
      description: Legacy-reader compatibility only. New v3 producers never emit this model-owned; deterministic proposal policy owns the pursuit decision.
    source_safety:
      type: string
      enum:
      - synthetic
      - sanitized
      - private-scratch
      - public-source
      - user-approved-local
      description: Source handling classification for proposal context.
  allow_undeclared_attributes: false
classification_taxonomies:
- id: proposal-stage
  version: 1.0.0
  output_attribute: opportunity_stage
  contributor_attribute_ids:
  - review_mode_observation
  source_classes: [user_provided, customer_system, reviewed_internal, public_web, synthetic_fixture]
  minimum_evidence: {observed_contributors: 1}
  basis_max_chars: 500
  ambiguity_policy: human-review
  no_match_policy: gap
  conflict_policy: human-review
  values:
  - value: early-review
    definition: The opportunity is in initial qualification before a formal bid/no-bid or specialist review gate.
    positive_indicators: [The supplied review mode explicitly describes intake, discovery, qualification, or early review.]
    exclusions: [A formal bid/no-bid, compliance, proof, or red-team review is already underway.]
  - value: bid-no-bid
    definition: The opportunity is at a formal gate where deterministic policy must decide pursue, review, or decline.
    positive_indicators: [The supplied review mode explicitly names bid/no-bid, pursuit review, or an equivalent formal gate.]
    exclusions: [A due date alone without a stated review gate.]
  - value: compliance-review
    definition: The current review is focused on requirements, compliance-sensitive boundaries, or mandatory response obligations.
    positive_indicators: [The supplied review mode explicitly names compliance or requirements review.]
    exclusions: [Generic legal or procurement language without an active compliance-review gate.]
  - value: proof-review
    definition: The current review is focused on proof, claims, references, win themes, or evidence sufficiency.
    positive_indicators: [The supplied review mode explicitly names proof, claim, evidence, or win-theme review.]
    exclusions: [A generic request for proposal quality review.]
  - value: red-team-review
    definition: The opportunity is at an adversarial red-team or final gap-review stage.
    positive_indicators: [The supplied review mode explicitly names red-team, final challenge, or adversarial gap review.]
    exclusions: [Early drafting or informal peer review.]
- id: proposal-category
  version: 1.0.0
  output_attribute: opportunity_category
  contributor_attribute_ids:
  - buyer_context_observation
  - requirement_observation
  source_classes: [user_provided, customer_system, reviewed_internal, public_web, synthetic_fixture]
  minimum_evidence: {observed_contributors: 2}
  basis_max_chars: 500
  ambiguity_policy: human-review
  no_match_policy: gap
  conflict_policy: human-review
  values:
  - value: municipal-modernization
    definition: A municipal buyer is seeking modernization of an existing public-facing or internal service workflow.
    positive_indicators: [The buyer observation establishes a municipal organization., The requirement observation establishes a modernization initiative.]
    exclusions: [A generic technology purchase without a supported modernization requirement.]
  - value: public-services-review
    definition: A public-services buyer has supplied requirements that require governed proposal review.
    positive_indicators: [The buyer observation establishes a public-services organization., The requirement observation establishes a bounded service, intake, integration, training, or review need.]
    exclusions: [An organization name alone without a supported requirement., A private commercial opportunity without public-services context.]
decision_input_contracts:
- id: proposal.opportunity-context
  version: 3.0.0
  description: Bounded opportunity, requirement, proof, timing, and policy evidence required before v3 proposal classification and deterministic pursuit review.
  normalization:
    prompt: prompts/normalize-opportunity.yaml
    prompt_version: proposal-opportunity-context.v3
    normalized_schema_ref: mdp.normalized-decision-input.v3
  source_classes: [user_provided, customer_system, reviewed_internal, public_web, synthetic_fixture]
  attributes:
  - id: buyer_name
    processing: observed
    question: What is the reviewed customer, agency, or buyer organization name?
    output_path: company
    value: {type: string}
    requirement: required
    decision_effects: [readiness, fit, routing, brief, gaps, no-draft]
    source_classes: [user_provided, customer_system, reviewed_internal, public_web, synthetic_fixture]
    provenance: {required: true, required_fields: [attempt_id, source_class, source_locator, observed_at]}
    confidence: {required: true, minimum: 80}
    freshness: {required: true, max_age_days: 365, allow_unknown: false}
    sensitivity: customer-private
    status_behavior: {}
  - id: opportunity_summary
    processing: observed
    question: What bounded supplied opportunity summary is supported?
    output_path: background
    value: {type: string}
    requirement: required
    decision_effects: [readiness, fit, routing, brief, gaps, no-draft]
    source_classes: [user_provided, customer_system, reviewed_internal, public_web, synthetic_fixture]
    provenance: {required: true, required_fields: [attempt_id, source_class, source_locator, observed_at]}
    confidence: {required: true, minimum: 80}
    freshness: {required: true, max_age_days: 365, allow_unknown: false}
    sensitivity: customer-private
    status_behavior: {}
  - id: due_date
    processing: observed
    question: What explicit submission or decision date was supplied?
    output_path: trigger
    value: {type: string}
    requirement: required
    decision_effects: [readiness, routing, brief, gaps, no-draft]
    source_classes: [user_provided, customer_system, reviewed_internal, public_web, synthetic_fixture]
    provenance: {required: true, required_fields: [attempt_id, source_class, source_locator, observed_at]}
    confidence: {required: true, minimum: 80}
    freshness: {required: true, max_age_days: 365, allow_unknown: false}
    sensitivity: customer-private
    status_behavior: {}
  - id: review_mode_observation
    processing: observed
