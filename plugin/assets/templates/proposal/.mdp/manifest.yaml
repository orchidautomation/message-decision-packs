    output_path: attributes.policy_conflict_observation
    value: {type: string}
    requirement: optional
    decision_effects: [disqualification, routing, gaps, human-review, no-draft]
    source_classes: [user_provided, customer_system, reviewed_internal, public_web, synthetic_fixture]
    provenance: {required: true, required_fields: [attempt_id, source_class, source_locator, observed_at]}
    confidence: {required: true, minimum: 80}
    freshness: {required: true, max_age_days: 365, allow_unknown: false}
