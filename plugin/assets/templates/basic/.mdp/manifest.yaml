classification_taxonomies:
- id: gtm-persona
  version: 1.0.0
  output_attribute: persona
  contributor_attribute_ids:
  - person_title
  - person_responsibilities
  source_classes:
  - user_provided
  - customer_system
  - reviewed_internal
  - public_web
  - synthetic_fixture
  minimum_evidence:
    observed_contributors: 2
  basis_max_chars: 500
  ambiguity_policy: human-review
  no_match_policy: gap
  conflict_policy: human-review
  values:
  - value: GTM Engineering
    definition: Owns or builds technical GTM systems, data workflows, automation, integrations, or agent-assisted revenue operations.
    positive_indicators:
    - Current title explicitly names GTM engineering, growth engineering, revenue systems, or a closely equivalent technical operations role.
    - Current responsibilities include building or governing GTM data, automation, integrations, agents, or operational systems.
    exclusions:
    - Quota-carrying sales responsibility without ownership of GTM systems or automation.
    - Generic RevOps coordination without evidence of technical system ownership.
  - value: PMM
    definition: Owns product marketing, positioning, messaging, launches, competitive narrative, or sales-enablement content.
    positive_indicators:
    - Current title explicitly names product marketing or a closely equivalent messaging role.
    - Current responsibilities include positioning, messaging, launches, competitive narrative, or enablement.
    exclusions:
    - Demand generation or sales work without product-marketing ownership.
    - Product management without positioning or messaging ownership.
  - value: PM
    definition: Owns product direction, requirements, prioritization, or delivery decisions for a software product.
    positive_indicators:
    - Current title explicitly names product management or product leadership.
    - Current responsibilities include roadmap, prioritization, requirements, or product delivery decisions.
    exclusions:
    - Project or program management without product decision authority.
    - Product marketing without roadmap or product-delivery ownership.
- id: gtm-account-segment
  version: 1.0.0
  output_attribute: segment
  contributor_attribute_ids:
  - company_fit_observation
  source_classes:
  - user_provided
  - customer_system
  - reviewed_internal
  - public_web
  - synthetic_fixture
  minimum_evidence:
    observed_contributors: 1
  basis_max_chars: 500
  ambiguity_policy: human-review
  no_match_policy: gap
  conflict_policy: human-review
  values:
  - value: agent-assisted GTM
    definition: The company has observable use, ownership, or active development of AI-assisted, automated, or programmatic GTM operations where governed messaging context is relevant.
    positive_indicators:
    - Evidence describes GTM engineering, revenue systems, operational AI, agents, or programmatic GTM workflows.
    - Evidence describes an active initiative to standardize or govern AI-assisted revenue or messaging operations.
    exclusions:
    - Generic AI positioning with no connection to GTM operations.
    - Ordinary CRM or sales tooling use without evidence of automation, agents, or programmatic operations.
