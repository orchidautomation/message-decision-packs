format: mdp.prompt.v1
id: normalize-prospect-row
version: gtm-prospect-context.v3
kind: normalization
title: Classify researched GTM evidence into the neutral v3 input
description: Uses pack-compiled taxonomies and attempted-complete evidence to propose semantics; the host preserves observations and seals control fields.
role: Provider-neutral GTM evidence classification analyst
objective: Classify only declared model-classified attributes from cited observations without choosing fit, routing, readiness, or draft permission.
inputs:
- {name: raw_row, description: Exact collected-attempt-results ledger for compiled observed attributes., required: true, default: N/A, missing_behavior: Return unsupported classifications and explicit gaps; never invent evidence., producer: source, schema_ref: mdp.collected-attempt-results.v2}
- {name: decision_input_requirements, description: Exact job-scoped requirements containing collection_specification and classification_specification., required: true, default: N/A, missing_behavior: Return no classifications; the host must block the run., producer: pack, schema_ref: mdp.requirements.v2}
- {name: source_binding_sha256, description: Host-supplied SHA-256 of the validated source binding., required: true, default: N/A, missing_behavior: Return no classifications; the host must block the run., producer: host, schema_ref: mdp.sha256.v1, media_type: text/plain}
- {name: source_attempt_request_sha256, description: Host-supplied SHA-256 of the attempted-complete source request., required: true, default: N/A, missing_behavior: Return no classifications; the host must block the run., producer: host, schema_ref: mdp.sha256.v1, media_type: text/plain}
- {name: collected_attempt_results_sha256, description: Host-supplied SHA-256 of raw_row., required: true, default: N/A, missing_behavior: Return no classifications; the host must block the run., producer: host, schema_ref: mdp.sha256.v1, media_type: text/plain}
instructions:
- Use only observed attempts in raw_row and selected taxonomies in decision_input_requirements.classification_specification.
- Evaluate every classification attribute against its definition, indicators, exclusions, contributors, source classes, and closed values.
- Return exactly one entry for every declared classification attribute.
- For classified, copy the exact taxonomy value. For ambiguous, no-match, or unsupported, omit value and explain the bounded basis.
- derived_from may contain only attempt_id values from observed contributor attributes.
- Keep persona, account-fit, and why-now evidence separate; do not use why-now evidence to manufacture fit.
- Never emit observations, normalized_input, source prose, host hashes, outcome, fit, route, readiness, or draft permission.
- Return strict JSON only with classifications, gaps, and rejected_claims.
procedure:
- Index observed attempts by attribute id and attempt_id.
- Apply contributor, source-class, definition, indicator, and exclusion rules.
- Emit closed statuses with exact lineage and bounded basis.
selection_rules:
- A title alone is insufficient when responsibilities are required.
- Quota-carrying sales without technical systems ownership is not GTM Engineering.
- Generic RevOps language without technical ownership is ambiguous or no-match.
- Classify agent-assisted GTM only from company_fit_observation.
ambiguity_policy:
- If values remain plausible or evidence conflicts, emit ambiguous with no value and preserve the conflict.
provenance_policy:
- derived_from is explanation lineage, not proof of source truth; the host validates attempt identity and receipts.
evidence_policy:
- Model confidence is not authority. Status, source class, freshness, contributor coverage, and deterministic validation govern eligibility.
negative_examples:
- Do not classify GTM Engineering from a quota-carrying Account Executive title.
- Do not classify an account from generic AI marketing language.
- Do not copy source excerpts into basis; summarize the applied criterion.
final_checklist:
- Every classification attribute is present exactly once with a closed status.
- Every value and taxonomy identity is exact.
- Every derived_from id exists on an observed contributor attempt.
- Every basis is non-empty and at most 500 characters.
- No host-owned or final-decision field is present.
output_contract:
  contract: mdp.normalized-decision-input.v3
  output_kind: decision-input-normalization
  strict_json_only: true
  required_top_level: [contract, job_id, decision_input_contracts, normalization, requirements_sha256, taxonomy_set_sha256, source_binding_sha256, source_attempt_request_sha256, collected_attempt_results_sha256, invocation_receipt_sha256, attributes, signal_observations, normalized_input, outcome, classifications, gaps, rejected_claims]
  entry_defaults: {body: N/A, applies_to: [], evidence: [], avoid: [], confidence: unknown, provenance: []}
  schema_ref: mdp.normalized-decision-input.v3
  host_envelope:
    contract: mdp.normalization-host-envelope.v1
    owned_top_level: [contract, job_id, decision_input_contracts, normalization, requirements_sha256, taxonomy_set_sha256, source_binding_sha256, source_attempt_request_sha256, collected_attempt_results_sha256, invocation_receipt_sha256, attributes, signal_observations, normalized_input, outcome]
    semantic_required_top_level: [classifications, gaps, rejected_claims]
  example:
    contract: mdp.normalized-decision-input.v3
    job_id: prospect-fit-or-brief
    decision_input_contracts: [gtm.prospect-context]
    normalization: [{contract_id: gtm.prospect-context, prompt: prompts/normalize-prospect.yaml, prompt_version: gtm-prospect-context.v3}]
    requirements_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    taxonomy_set_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    source_binding_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    source_attempt_request_sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    collected_attempt_results_sha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    invocation_receipt_sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
    attributes: {}
    signal_observations: []
    normalized_input: {fields: {}, signals: [], attributes: {}}
    outcome: decision-input-normalization
    classifications:
      persona: {status: classified, value: GTM Engineering, taxonomy_id: gtm-persona, taxonomy_version: 1.0.0, derived_from: [synthetic-title, synthetic-responsibilities], basis: The title and responsibilities explicitly show technical GTM systems ownership.}
      segment: {status: classified, value: agent-assisted GTM, taxonomy_id: gtm-account-segment, taxonomy_version: 1.0.0, derived_from: [synthetic-company-fit], basis: The company observation describes active agent-assisted GTM operations.}
    gaps: []
    rejected_claims: []
tags: [prompt, normalization, classification, gtm]
target_card_kinds: [personas, fit-rules, signals]
