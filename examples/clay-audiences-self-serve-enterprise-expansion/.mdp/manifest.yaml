    freshness:
      required: true
      max_age_days: 180
      allow_unknown: false
    sensitivity: personal-data
    status_behavior: {}
  - id: latest_support_context
    question: What bounded reviewed support context explains the open escalation?
    description: Preserve a neutral summary only; do not copy tickets or private conversations.
    output_path: attributes.latest_support_context
    value:
      type: string
    requirement: conditional
    applies_when:
    - attribute: open_support_escalation
      operator: equals
      values:
      - escalation-open
    decision_effects:
    - fit
    - routing
    - brief
    - gaps
    - human-review
    - no-draft
    source_classes:
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
      - excerpt
    confidence:
      required: true
      minimum: 100
    freshness:
      required: true
      max_age_days: 7
      allow_unknown: false
    sensitivity: restricted
    status_behavior: {}
  - id: employee_band
    question: What reviewed employee-count band describes the company?
    description: Optional context for prioritization; missing data must not block the motion.
    output_path: attributes.employee_band
    value:
      type: string
      enum:
      - 1-50
      - 51-200
      - 201-1000
      - 1001+
      - unknown
    requirement: optional
    decision_effects:
    - fit
    - brief
    - gaps
    source_classes:
    - user_provided
    - customer_system
    - reviewed_internal
    - public_web
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 75
    freshness:
      required: true
      max_age_days: 365
      allow_unknown: true
    sensitivity: public
    status_behavior: {}
  - id: executive_sponsor
    question: Is an executive sponsor state identified for this account?
    description: Optional bounded state; do not put sponsor names or contact details in this attribute.
    output_path: attributes.executive_sponsor
    value:
      type: string
      enum:
      - identified
      - not-identified
      - unknown
    requirement: optional
    decision_effects:
    - routing
    - brief
    - gaps
    source_classes:
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 100
    freshness:
      required: true
      max_age_days: 30
      allow_unknown: true
    sensitivity: customer-private
    status_behavior: {}
input_contracts:
- id: prospect
  description: Reviewed prospect/source-row input contract for person, account, and relationship context.
  schema_ref: mdp.input.prospect.v0
  prompt: prompts/normalize-prospect.yaml
  normalizes:
  - account
  - person
  - relationship
  decision_input_contracts:
  - clay.audiences.self_serve_enterprise_expansion
jobs:
- id: prospect-fit-or-brief
  skill_id: mdp-pack-apply
  label: Prospect row to fit decision or brief
  description: Normalize supplied prospect context and check fit against reviewed Synthetic Expansion Product evidence.
  required_primitives:
  - actors
  - decision-criteria
  - source-signals
  - evidence-proof
  - boundaries
  - output-contracts
  - routing-jobs
  - gaps
  input_contracts:
  - prospect
  decision_input_contracts:
  - clay.audiences.self_serve_enterprise_expansion
- id: outbound-copy-brief
  skill_id: mdp-pack-apply
  label: Outbound copy brief
  description: Produce grounded Synthetic Expansion Product copy guidance only after fit, proof, and boundaries are supported.
  required_primitives:
  - actors
  - decision-criteria
  - source-signals
  - evidence-proof
  - boundaries
  - output-contracts
  - routing-jobs
  - gaps
  input_contracts:
  - prospect
- id: outbound-copy-review
  skill_id: mdp-pack-apply
  label: Supplied outbound copy review
  description: Review supplied copy against approved Synthetic Expansion Product claims, proof, boundaries, and output rules.
  required_primitives:
  - actors
  - decision-criteria
  - source-signals
  - evidence-proof
  - boundaries
  - output-contracts
  - routing-jobs
  - gaps
  input_contracts:
  - prospect
profile_eval:
  required_categories:
  - proceed
  - insufficient-context
  - unsafe-output
  - job-routing
  - account-context-missing
  activation:
    status: needs-review
    summary: Target identity for Synthetic Expansion Product is resolved; commercial claims and ICP detail remain evidence gaps.
