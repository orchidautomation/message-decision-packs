format: mdp.v0
id: clay-audiences-self-serve-enterprise-expansion
name: Clay Audiences Self-Serve Enterprise Expansion
version: 0.1.0
description: Evidence-gated messaging decisions for Synthetic Expansion Product. Product claims, ICP detail, and proof remain gaps until sources support them.
target:
  kind: product
  name: Synthetic Expansion Product
  aliases:
  - Example Expansion Product
  external_terms:
  - Synthetic Expansion Product
  excluded_terms:
  - Basic MDP Template
  - agent-assisted GTM
  - local-cli
  - agent-plugin
  - example-mdp-demo
  - real customer
  internal_terms:
  - MDP
  - Message Decision Pack
  - mdp CLI
  - manifest plus modular cards
  - local offline decision layer
  - agent handoffs
  source_ids:
  - target-identity
profile:
  id: gtm
  label: GTM Messaging
  version: mdp.profile.v0
  context_dimensions:
    segment:
    - target-segment
personas:
- Buyer
- Operator
target_personas:
- Buyer
- Operator
operator_roles:
- Operator
supported_channels:
- linkedin
- email
- call-prep
- agent-brief
persona_mappings:
- persona: Buyer
  title_keywords:
  - buyer
  - decision maker
- persona: Operator
  title_keywords:
  - operator
  - owner
lead_input_requirements:
  required_fields:
  - name
  - title
  - company
  - company_domain
  - trigger
  required_signal_fields: []
  required_attributes:
  - customer_motion
  - enterprise_eligibility
  - do_not_contact
  - open_support_escalation
  - account_owner_state
  - last_meaningful_touch
  value_contracts:
    segment:
      type: string
      enum:
      - self-serve-enterprise-expansion
      description: Synthetic segment label for this example motion.
    source_kind:
      type: string
      enum:
      - user-provided-row
      - csv-row
      - crm-export-row
      - clay-row
      - deepline-row
      - private-scratch-row
      - sanitized-example
      - synthetic-example
      description: Provider-neutral source markers accepted from normalization prompts.
  attribute_definitions:
    account_owner_state:
      type: string
      enum:
      - assigned
      - unassigned
      - unknown
      description: Reviewed ownership state; no owner names or contact values are required.
    current_working_country:
      type: string
      description: Current working country when person-level applicability is established.
    customer_motion:
      type: string
      enum:
      - self-serve
      - sales-assisted
      - unknown
      description: Current customer motion used to determine whether this expansion job applies.
    do_not_contact:
      type: string
      enum:
      - clear
      - blocked
      description: Customer-controlled suppression gate.
    employee_band:
      type: string
      enum:
      - 1-50
      - 51-200
      - 201-1000
      - 1001+
      - unknown
      description: Optional bounded company-size band.
    enterprise_eligibility:
      type: string
      enum:
      - eligible
      - ineligible
      - needs-review
      description: Deterministic enterprise expansion eligibility gate.
    executive_sponsor:
      type: string
      enum:
      - identified
      - not-identified
      - unknown
      description: Optional sponsor-state marker without person details.
    last_meaningful_touch:
      type: string
      format: date-time
      description: Timestamp of the last reviewed meaningful customer interaction.
    latest_support_context:
      type: string
      description: Bounded reviewed support summary when an escalation is open.
    open_support_escalation:
      type: string
      enum:
      - escalation-clear
      - escalation-open
      description: Customer-controlled active support escalation gate.
required_primitives:
- actors
- decision-criteria
- source-signals
- needs-requirements
- evidence-proof
- boundaries
- output-contracts
- routing-jobs
- gaps
- evals
primitive_map:
  actors:
    cards:
    - personas
    input_contracts:
    - prospect
  boundaries:
    cards:
    - avoid-rules
    - objections
    - positioning
  decision-criteria:
    cards:
    - fit-rules
  evals:
    evals:
    - target-route
    - fit-ready
    - fit-disqualified
    - fit-insufficient-context
    - account-context-missing
    - internal-control-plane-rejected
  evidence-proof:
    cards:
    - claims
    - positioning
  gaps:
    cards:
    - gaps
    evals:
    - fit-insufficient-context
    - account-context-missing
  needs-requirements:
    cards:
    - pains
  output-contracts:
    cards:
    - output-rules
    - copy-patterns
    - ctas
    - hooks
    - channel-policies
  routing-jobs:
    cards:
    - channel-policies
    - motions
    jobs:
    - prospect-fit-or-brief
    - outbound-copy-brief
    - outbound-copy-review
  source-signals:
    cards:
    - signals
    prompts:
    - normalize-prospect-row
    input_contracts:
    - prospect
    evals:
    - account-context-missing
decision_input_contracts:
- id: clay.audiences.self_serve_enterprise_expansion
  version: 1.0.0
  description: Attempted-complete source and normalization contract for the synthetic Clay Audiences enterprise expansion motion.
  normalization:
    prompt: prompts/normalize-prospect.yaml
    prompt_version: clay-self-serve-enterprise-expansion.v4
    normalized_schema_ref: mdp.normalized-decision-input.v2
  source_classes:
  - user_provided
  - customer_system
  - reviewed_internal
  - public_web
  - synthetic_fixture
  signal_projections:
  - id: account-fit
    kind: enterprise_expansion_fit
    roles:
    - fit
    contributor_attribute_ids:
    - enterprise_eligibility
    value:
      type: string
      enum:
      - eligible
      - ineligible
      - needs-review
    cardinality:
      min: 1
      max: 2
    conflict_policy: require-agreement
    decision_effects:
    - readiness
    - fit
    - gaps
    - no-draft
  - id: buyer-role
    kind: revenue_operations_buyer
    roles:
    - person-resolution
    contributor_attribute_ids:
    - person_title
    value:
      type: string
    cardinality:
      min: 1
      max: 2
    conflict_policy: require-agreement
    decision_effects:
    - readiness
    - fit
    - routing
    - brief
    - gaps
    - no-draft
  - id: buying-window
    kind: expansion_timing
    roles:
    - why-now
    contributor_attribute_ids:
    - expansion_trigger_summary
    value:
      type: string
    cardinality:
      min: 1
      max: 4
    conflict_policy: require-agreement
    decision_effects:
    - readiness
    - fit
    - brief
    - gaps
    - no-draft
  attributes:
  - id: company_name
    question: What is the reviewed company name for this customer account?
    description: Establish the account identity without inferring a company from a person record.
    output_path: company
    value:
      type: string
    requirement: required
    decision_effects:
    - readiness
    - fit
    - routing
    - brief
    - gaps
    - no-draft
    source_classes:
    - user_provided
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 90
    freshness:
      required: false
      allow_unknown: true
    sensitivity: customer-private
    status_behavior: {}
  - id: company_domain
    question: What is the canonical company domain for this customer account?
    description: Supply the stable account key; do not infer it from the company name.
    output_path: company_domain
    value:
      type: string
    requirement: required
    decision_effects:
    - readiness
    - fit
    - routing
    - gaps
    - no-draft
    source_classes:
    - user_provided
    - customer_system
    - reviewed_internal
    - public_web
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 90
    freshness:
      required: false
      allow_unknown: true
    sensitivity: customer-private
    status_behavior: {}
  - id: person_name
    question: What is the reviewed full name of the person associated with this motion?
    description: Identify the intended person without discovering or inventing a contact.
    output_path: name
    value:
      type: string
    requirement: required
    decision_effects:
    - readiness
    - routing
    - brief
    - gaps
    - no-draft
    source_classes:
    - user_provided
    - customer_system
    - reviewed_internal
    - public_web
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 90
    freshness:
      required: false
      allow_unknown: true
    sensitivity: personal-data
    status_behavior: {}
  - id: person_title
    question: What is the person's current reviewed job title?
    description: Resolve the pack persona and route; stale or ambiguous titles require review.
    output_path: title
    value:
      type: string
    requirement: required
    decision_effects:
    - readiness
    - fit
    - routing
    - brief
    - gaps
    - no-draft
    source_classes:
    - user_provided
    - customer_system
    - reviewed_internal
    - public_web
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 85
    freshness:
      required: true
      max_age_days: 180
      allow_unknown: false
    sensitivity: personal-data
    status_behavior: {}
  - id: expansion_trigger_summary
    question: What source-backed event makes enterprise expansion relevant now?
    description: State the bounded why-now context without drafting a message.
    output_path: trigger
    value:
      type: string
    requirement: required
    decision_effects:
    - readiness
    - fit
    - routing
    - brief
    - gaps
    - no-draft
    source_classes:
    - user_provided
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
      - excerpt
    confidence:
      required: true
      minimum: 80
    freshness:
      required: true
      max_age_days: 90
      allow_unknown: false
    sensitivity: customer-private
    status_behavior: {}
  - id: account_owner_state
    question: Is the customer account assigned to an accountable owner?
    description: Use a bounded state only; owner names and contact values are not required.
    output_path: attributes.account_owner_state
    value:
      type: string
      enum:
      - assigned
      - unassigned
      - unknown
    requirement: required
    decision_effects:
    - readiness
    - routing
    - brief
    - gaps
    - no-draft
    source_classes:
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 100
    freshness:
      required: true
      max_age_days: 7
      allow_unknown: false
    sensitivity: customer-private
    status_behavior: {}
  - id: last_meaningful_touch
    question: When did the last reviewed meaningful customer interaction occur?
    description: Preserve the timestamp only; do not copy private conversation text into the pack.
    output_path: attributes.last_meaningful_touch
    value:
      type: string
      format: date-time
    requirement: required
    decision_effects:
    - readiness
    - fit
    - routing
    - brief
    - gaps
    - no-draft
    source_classes:
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 100
    freshness:
      required: true
      max_age_days: 90
      allow_unknown: false
    sensitivity: customer-private
    status_behavior: {}
  - id: customer_motion
    question: Is this account currently in the self-serve customer motion?
    description: Hard gate for whether this specific expansion job applies.
    output_path: attributes.customer_motion
    value:
      type: string
      enum:
      - self-serve
      - sales-assisted
      - unknown
    requirement: hard-gate
    decision_effects:
    - readiness
    - fit
    - disqualification
    - routing
    - gaps
    - human-review
    - no-draft
    source_classes:
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 100
    freshness:
      required: true
      max_age_days: 7
      allow_unknown: false
    sensitivity: customer-private
    status_behavior:
      observed: evaluate
      not_found: block
      not_applicable: block
      blocked: human-review
      error: human-review
  - id: enterprise_eligibility
    question: Is the account eligible for the synthetic enterprise expansion motion?
    description: Hard gate derived from reviewed customer policy, never from model judgment.
    output_path: attributes.enterprise_eligibility
    value:
      type: string
      enum:
      - eligible
      - ineligible
      - needs-review
    requirement: hard-gate
    decision_effects:
    - readiness
    - fit
    - disqualification
    - routing
    - gaps
    - human-review
    - no-draft
    source_classes:
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 100
    freshness:
      required: true
      max_age_days: 7
      allow_unknown: false
    sensitivity: customer-private
    status_behavior:
      observed: evaluate
      not_found: block
      not_applicable: block
      blocked: human-review
      error: human-review
  - id: do_not_contact
    question: Is this account or person currently suppressed from contact?
    description: Hard safety gate owned by the customer's suppression policy.
    output_path: attributes.do_not_contact
    value:
      type: string
      enum:
      - clear
      - blocked
    requirement: hard-gate
    decision_effects:
    - readiness
    - disqualification
    - routing
    - gaps
    - human-review
    - no-draft
    source_classes:
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 100
    freshness:
      required: true
      max_age_days: 1
      allow_unknown: false
    sensitivity: restricted
    status_behavior:
      observed: evaluate
      not_found: block
      not_applicable: block
      blocked: human-review
      error: human-review
  - id: open_support_escalation
    question: Is there an unresolved support escalation that should pause this motion?
    description: Hard customer-experience gate; absence is not inferred from missing support data.
    output_path: attributes.open_support_escalation
    value:
      type: string
      enum:
      - escalation-clear
      - escalation-open
    requirement: hard-gate
    decision_effects:
    - readiness
    - disqualification
    - routing
    - gaps
    - human-review
    - no-draft
    source_classes:
    - customer_system
    - reviewed_internal
    - synthetic_fixture
    provenance:
      required: true
      required_fields:
      - attempt_id
      - source_class
      - source_locator
      - observed_at
    confidence:
      required: true
      minimum: 100
    freshness:
      required: true
      max_age_days: 1
      allow_unknown: false
    sensitivity: restricted
    status_behavior:
      observed: evaluate
      not_found: block
      not_applicable: block
      blocked: human-review
      error: human-review
  - id: current_working_country
    question: What is the person's current working country when regional routing applies?
    description: Attempt only for a resolved person when the customer permits this personal-data use.
    output_path: attributes.current_working_country
    value:
      type: string
    requirement: conditional
    applies_when:
    - attribute: person_name
      operator: exists
    decision_effects:
    - routing
    - brief
    - gaps
    - human-review
    - no-draft
    source_classes:
    - user_provided
    - customer_system
    - reviewed_internal
    - public_web
    - synthetic_fixture
    provenance:
