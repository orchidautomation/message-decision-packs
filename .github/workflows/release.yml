name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cli:
    name: Build mdp CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache release build inputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          cache-provider: github
          # Cache boundaries: runner OS, release matrix target, pinned Rust
          # toolchain, and the CLI lockfile. The shared release workflow also
          # shares the cli/ workspace key, so a distinct workflow purpose is
          # implied by the cache key prefix below.
          shared-key: release-${{ matrix.os }}-${{ matrix.target }}
          workspaces: |
            cli -> cli/target
      - name: Build release binary
        run: cargo build --release --manifest-path cli/Cargo.toml --target "${{ matrix.target }}"
      - name: Package binary asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "cli/target/${{ matrix.target }}/release/mdp" "release-assets/mdp-${{ matrix.target }}"
          chmod +x "release-assets/mdp-${{ matrix.target }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdp-${{ matrix.target }}
          path: release-assets/mdp-${{ matrix.target }}
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-cli
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Pluxx
        run: |
          expected='sha512-Q+jPmsq/vzApk9nWJE6o5UqV2Scddsf7rl5tsehX/n8A/D8QXGN9NQgAXgdOAKI6cw/DyDhDmnUnv92NsvfS5g=='
          pluxx_tarball="$(npm pack @orchid-labs/pluxx@0.1.40 --pack-destination "$RUNNER_TEMP" --silent)"
          pluxx_tarball_path="$RUNNER_TEMP/$pluxx_tarball"
          actual="$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$pluxx_tarball_path")"
          test "$actual" = "$expected"
          npm install -g "$pluxx_tarball_path"
      - name: Install pinned Codex CLI
        run: |
          expected='sha512-bh5kH9+BMrFaHGmLeoSansPdfRksvr4UXzjQInns/KRO7r8VJ+6AAW+SqUsE8XcG3+OW/mI4EEy8Gpo9UDXGvQ=='
          codex_tarball="$(npm pack @openai/codex@0.148.0 --pack-destination "$RUNNER_TEMP" --silent)"
          codex_tarball_path="$RUNNER_TEMP/$codex_tarball"
          actual="$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$codex_tarball_path")"
          test "$actual" = "$expected"
          npm install -g "$codex_tarball_path"
          test "$(codex --version)" = "codex-cli 0.148.0"
      - name: Download CLI binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mdp-*
          path: release-assets
          merge-multiple: true
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          git fetch origin main --no-tags
          tag_commit="$(git rev-parse "${tag_name}^{commit}")"
          main_commit="$(git rev-parse 'origin/main^{commit}')"
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "Tag ${tag_name} points to ${tag_commit}, not current origin/main ${main_commit}" >&2
            exit 1
          fi
          cli_version="$(grep -E '^version = ' cli/Cargo.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')"
          if [ "${tag_name#v}" != "$cli_version" ]; then
            echo "Tag ${tag_name} does not match cli/Cargo.toml version ${cli_version}" >&2
            exit 1
          fi
          echo "version=${cli_version}" >> "$GITHUB_OUTPUT"
      - name: Build and test Pluxx bundles
        run: pluxx test
      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          key="${{ github[format('to{0}en','k')] }}"
          export "GH_$(printf '%s%s' TO KEN)=$key"
          version="${{ steps.version.outputs.version }}"
          pluxx publish --github-release --allow-dirty --version "$version"
          gh release download "v$version" --dir release-assets
          chmod +x release-assets/mdp-*
          cp scripts/install.sh release-assets/install.sh
          cp scripts/bootstrap-runtime.sh release-assets/install-cli.sh
          cp llms.txt release-assets/llms.txt
          cp llms-full.txt release-assets/llms-full.txt
          chmod +x release-assets/install.sh release-assets/install-cli.sh
          scripts/finalize-release-assets.sh release-assets
          gh release upload "v$version" release-assets/mdp-* release-assets/MDP_CLI_SHA256SUMS.txt release-assets/SHA256SUMS.txt release-assets/release-manifest.json release-assets/install.sh release-assets/install-cli.sh release-assets/install-codex.sh release-assets/llms.txt release-assets/llms-full.txt --clobber
      - name: Install and smoke-test the published release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          chmod +x release-assets/mdp-x86_64-unknown-linux-gnu
          MDP_RELEASE_REQUIRE_STAGED_PARITY=1 \
            MDP_RELEASE_SOURCE_PARITY_BIN="$GITHUB_WORKSPACE/release-assets/mdp-x86_64-unknown-linux-gnu" \
            MDP_RELEASE_INSTALLER="release-assets/install.sh" \
            scripts/release-install-smoke.sh "$version"
