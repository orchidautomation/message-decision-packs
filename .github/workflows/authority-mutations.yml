name: Authority mutations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: authority-mutations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authority-mutation-classifier:
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect an exact version-only release change
        id: release-diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          release_only=false
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]] &&
             [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             [[ "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            classification="$(node scripts/classify-version-only-release.mjs "$BEFORE_SHA" "$AFTER_SHA")"
            if [[ "$classification" == "release-only" ]]; then
              release_only=true
            fi
          fi
          echo "release_only=$release_only" >> "$GITHUB_OUTPUT"
      - name: Classify authority mutation policy
        id: classify
        uses: actions/github-script@v7
        env:
          RELEASE_ONLY: ${{ steps.release-diff.outputs.release_only }}
        with:
          script: |
            const setClassification = (classification) => {
              core.setOutput('classification', classification)
              core.info(`authority mutation policy=${classification}`)
            }
            // Reuse must terminate at a real full campaign. Requiring the four
            // shard jobs prevents a later version-only bump from chaining from
            // another reuse result indefinitely.
            const successfulFullRunFor = async (sha) => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'authority-mutations.yml',
                branch: 'main',
                event: 'push',
                status: 'completed',
                head_sha: sha,
                per_page: 100,
              })
              for (const run of runs.filter(({ conclusion }) => conclusion === 'success')) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  filter: 'latest',
                  per_page: 100,
                })
                const successful = new Set(
                  jobs.filter(({ conclusion }) => conclusion === 'success').map(({ name }) => name),
                )
                const required = [
                  'authority-mutation-shard-0/4',
                  'authority-mutation-shard-1/4',
                  'authority-mutation-shard-2/4',
                  'authority-mutation-shard-3/4',
                  'authority-mutations',
                ]
                if (required.every((name) => successful.has(name))) return true
              }
              return false
            }
            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              setClassification('full')
              return
            }
            if (context.eventName === 'push') {
              if (process.env.RELEASE_ONLY !== 'true') {
                setClassification('full')
                return
              }
              try {
                if (await successfulFullRunFor(context.payload.before)) {
                  setClassification('reuse')
                } else {
                  core.warning('No successful complete predecessor evidence; running the full campaign.')
                  setClassification('full')
                }
              } catch (error) {
                core.warning(`Authority evidence lookup failed; running the full campaign: ${error.message}`)
                setClassification('full')
              }
              return
            }
            if (context.eventName !== 'pull_request') {
              core.setFailed(`unsupported event for authority mutation policy: ${context.eventName}`)
              return
            }
            if (process.env.RELEASE_ONLY === 'true') {
              setClassification('release-only')
              return
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number, per_page: 100,
            })
            const smokePath = (path) =>
              path === '.github/workflows/authority-mutations.yml' ||
              path === 'scripts/test-authority-mutations.sh' ||
              path === 'scripts/test-authority-mutations-contract.mjs' ||
              path === 'scripts/classify-version-only-release.mjs' ||
              path === 'scripts/test-version-only-release-classifier.mjs' ||
              path === 'cli/Cargo.toml' ||
              path === 'cli/Cargo.lock' ||
              path.startsWith('cli/src/authority/') ||
              path.startsWith('plugin/assets/authority-conformance/') ||
              path.startsWith('assets/authority-conformance/')
            const classification = files.some(({ filename }) => smokePath(filename)) ? 'smoke' : 'skip'
            setClassification(classification)
            core.info(`changed_files=${files.length}`)

  authority-mutation-tool:
    needs: authority-mutation-classifier
    if: needs.authority-mutation-classifier.result == 'success' && (needs.authority-mutation-classifier.outputs.classification == 'smoke' || needs.authority-mutation-classifier.outputs.classification == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cargo-mutants
        run: |
          cargo install cargo-mutants --version 27.1.0 --locked
          mkdir -p "$RUNNER_TEMP/cargo-mutants-bin"
          cp "$HOME/.cargo/bin/cargo-mutants" "$RUNNER_TEMP/cargo-mutants-bin/cargo-mutants"
      - name: Upload pinned cargo-mutants
        uses: actions/upload-artifact@v7
        with:
          name: cargo-mutants-27.1.0
          path: ${{ runner.temp }}/cargo-mutants-bin/cargo-mutants
          if-no-files-found: error

  authority-mutation-contract:
    needs: authority-mutation-classifier
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Validate authority mutation contract
        run: node scripts/test-authority-mutations-contract.mjs

  authority-mutation-smoke:
    needs: [authority-mutation-classifier, authority-mutation-tool, authority-mutation-contract]
    if: needs.authority-mutation-classifier.result == 'success' && needs.authority-mutation-classifier.outputs.classification == 'smoke' && needs.authority-mutation-tool.result == 'success' && needs.authority-mutation-contract.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: cargo-mutants-27.1.0
          path: ${{ runner.temp }}/cargo-mutants-bin
      - name: Add cargo-mutants to PATH
        run: |
          chmod +x "$RUNNER_TEMP/cargo-mutants-bin/cargo-mutants"
          echo "$RUNNER_TEMP/cargo-mutants-bin" >> "$GITHUB_PATH"
      - name: Kill smoke authority mutants
        run: bash scripts/test-authority-mutations.sh --smoke

  authority-mutation-shard:
    name: authority-mutation-shard-${{ matrix.shard }}
    needs: [authority-mutation-classifier, authority-mutation-tool, authority-mutation-contract]
    if: needs.authority-mutation-classifier.result == 'success' && needs.authority-mutation-classifier.outputs.classification == 'full' && needs.authority-mutation-tool.result == 'success' && needs.authority-mutation-contract.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Disjoint shard topology: every focused mutation must appear in
        # exactly one shard, and the aggregate gate fails on any shard
        # failure or surviving mutant. The contract test enforces the
        # matrix and selector invariants; the script enforces the
        # 24-candidate cap and pinned 27.1.0 tool.
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache mutation build inputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          cache-provider: github
          # Cache boundaries: runner OS, pinned Rust toolchain, the CLI
          # lockfile, the cargo-mutants version, and the matrix shard. Each
          # shard gets its own cache slot so an unbalanced topology cannot
          # silently reuse another shard's mutated artifacts.
          shared-key: authority-mutations-${{ runner.os }}-${{ matrix.shard }}
          workspaces: |
            cli -> cli/target
      - name: Download pinned cargo-mutants
        uses: actions/download-artifact@v8
        with:
          name: cargo-mutants-27.1.0
          path: ${{ runner.temp }}/cargo-mutants-bin
      - name: Add cargo-mutants to PATH
        run: |
          chmod +x "$RUNNER_TEMP/cargo-mutants-bin/cargo-mutants"
          echo "$RUNNER_TEMP/cargo-mutants-bin" >> "$GITHUB_PATH"
      - name: Kill focused authority mutants
        run: bash scripts/test-authority-mutations.sh "${{ matrix.shard }}"

  authority-mutations:
    if: always()
    needs: [authority-mutation-classifier, authority-mutation-contract, authority-mutation-smoke, authority-mutation-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require the valid authority mutation policy result
        env:
          CLASSIFICATION: ${{ needs.authority-mutation-classifier.outputs.classification }}
          CLASSIFIER_RESULT: ${{ needs.authority-mutation-classifier.result }}
          CONTRACT_RESULT: ${{ needs.authority-mutation-contract.result }}
          SMOKE_RESULT: ${{ needs.authority-mutation-smoke.result }}
          FULL_RESULT: ${{ needs.authority-mutation-shard.result }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          test "$CONTRACT_RESULT" = success
          case "$CLASSIFICATION:$SMOKE_RESULT:$FULL_RESULT" in
            smoke:success:skipped|skip:skipped:skipped|release-only:skipped:skipped|reuse:skipped:skipped|full:skipped:success) ;;
            *) echo "invalid authority mutation result tuple: $CLASSIFICATION:$SMOKE_RESULT:$FULL_RESULT" >&2; exit 1 ;;
          esac
