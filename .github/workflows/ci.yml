name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check formatting
        run: cargo fmt --check
        working-directory: cli
      - name: Test CLI
        run: cargo test
        working-directory: cli
      - name: Validate authority monotonicity corpus and registered projections
        run: make validate-authority-conformance
      - name: Validate bundled template
        run: cargo run -- --json validate --dir ../plugin/assets/templates/basic
        working-directory: cli
      - name: Eval bundled template
        run: cargo run -- --json eval --dir ../plugin/assets/templates/basic
        working-directory: cli
      - name: Validate five-skill routing and eval corpus
        run: |
          python3 -m unittest scripts/test_skill_eval_harness.py
          python3 scripts/skill-eval-harness.py --mdp-bin cli/target/debug/mdp

  authority-mutation-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cargo-mutants
        run: |
          cargo install cargo-mutants --version 27.1.0 --locked
          mkdir -p "$RUNNER_TEMP/cargo-mutants-bin"
          cp "$HOME/.cargo/bin/cargo-mutants" "$RUNNER_TEMP/cargo-mutants-bin/cargo-mutants"
      - name: Upload pinned cargo-mutants
        uses: actions/upload-artifact@v7
        with:
          name: cargo-mutants-27.1.0
          path: ${{ runner.temp }}/cargo-mutants-bin/cargo-mutants
          if-no-files-found: error

  authority-mutation-shard:
    name: authority-mutation-shard-${{ matrix.shard }}
    needs: authority-mutation-tool
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/2", "1/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download pinned cargo-mutants
        uses: actions/download-artifact@v8
        with:
          name: cargo-mutants-27.1.0
          path: ${{ runner.temp }}/cargo-mutants-bin
      - name: Add cargo-mutants to PATH
        run: |
          chmod +x "$RUNNER_TEMP/cargo-mutants-bin/cargo-mutants"
          echo "$RUNNER_TEMP/cargo-mutants-bin" >> "$GITHUB_PATH"
      - name: Kill focused authority mutants
        run: bash scripts/test-authority-mutations.sh "${{ matrix.shard }}"

  authority-mutations:
    if: always()
    needs: authority-mutation-shard
    runs-on: ubuntu-latest
    steps:
      - name: Require every authority mutation shard
        env:
          SHARD_RESULT: ${{ needs.authority-mutation-shard.result }}
        run: test "$SHARD_RESULT" = success

  pluxx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Pluxx
        run: |
          expected='sha512-Q+jPmsq/vzApk9nWJE6o5UqV2Scddsf7rl5tsehX/n8A/D8QXGN9NQgAXgdOAKI6cw/DyDhDmnUnv92NsvfS5g=='
          pluxx_tarball="$(npm pack @orchid-labs/pluxx@0.1.40 --pack-destination "$RUNNER_TEMP" --silent)"
          pluxx_tarball_path="$RUNNER_TEMP/$pluxx_tarball"
          actual="$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$pluxx_tarball_path")"
          test "$actual" = "$expected"
          npm install -g "$pluxx_tarball_path"
      - name: Check Pluxx source health
        run: pluxx doctor
      - name: Lint Pluxx source
        run: pluxx lint
      - name: Test Pluxx bundles
        run: pluxx test
      - name: Verify generated skill bundles
        run: python3 scripts/validate-skill-packaging.py --require-bundles
      - name: Test Pluxx hook and diagnostic contracts
        run: bash scripts/test-pluxx-hooks.sh

  eve-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/ai-sdr-eve-vercel/package-lock.json
      - name: Build source MDP CLI
        run: cargo build --manifest-path cli/Cargo.toml
      - name: Add source MDP CLI to PATH
        run: echo "$GITHUB_WORKSPACE/cli/target/debug" >> "$GITHUB_PATH"
      - name: Install Eve dependencies
        run: npm ci
        working-directory: examples/ai-sdr-eve-vercel
      - name: Validate canonical Eve example
        run: npm run check
        working-directory: examples/ai-sdr-eve-vercel
