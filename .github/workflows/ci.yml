name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cli:
              - ".github/workflows/ci.yml"
              - ".github/workflows/release.yml"
              - ".github/workflows/authority-mutations.yml"
              - "cli/**"
              - "rust-toolchain.toml"
              - "Makefile"
              - "plugin/.codex-plugin/plugin.json"
              - "plugin/assets/**"
              - "plugin/assets/templates/**"
              - "plugin/assets/authority-conformance/**"
              - "plugin/assets/**/*.md"
              - "assets/authority-conformance/**"
              - "assets/**"
              - "assets/**/*.md"
              - "plugin/skills/**"
              - "plugin/skill-evals/**"
              - "examples/clay-audiences-self-serve-enterprise-expansion/**"
              - "scripts/fixtures/proposal-runner/**"
              - "examples/run-conformance/**"
              - "examples/clay-row.json"
              - "examples/decision-input-scenarios.json"
              - "examples/prospect-row.json"
              - "examples/ai-sdr-eve-vercel/agent/instructions.md"
              - "llms.txt"
              - "llms-full.txt"
              - "scripts/skill-eval-harness.py"
              - "scripts/test_skill_eval_harness.py"
              - "scripts/run-skill-behavioral-evals.py"
              - "scripts/test_skill_behavioral_evals.py"
              - "scripts/validate-skill-packaging.py"
              - "scripts/test_skill_packaging.py"
              - "scripts/test-authority-conformance.mjs"
              - "scripts/test-run-mcp-server.mjs"
              - "scripts/test-run-mcp-queued-cancellation.sh"
              - "scripts/test-proposal-mcp-queued-cancellation.sh"
              - "scripts/mdp-run-mcp-server.mjs"
              - "scripts/test-temp-workspace.mjs"
              - "scripts/with-temp-workspace.mjs"
              - "scripts/test-proposal-mcp-server.sh"
              - "scripts/mdp-proposal-mcp-server.mjs"
              - "scripts/mdp-proposal-runner.mjs"
              - "scripts/test-release-workflow.mjs"
              - "scripts/patch-codex-installer.mjs"
              - "scripts/test-opencode-wrapper.mjs"
              - "scripts/test-authority-mutations-contract.mjs"
              - "scripts/test-authority-mutations.sh"
              - "scripts/test-native-model-driver.mjs"
              - "scripts/mdp-native-model-openai.mjs"
              - "scripts/mdp-native-normalize-openai.mjs"
              - "scripts/lib/deadline-policy.mjs"
              - "scripts/lib/identity-bound-directory.mjs"
              - "scripts/lib/process-supervisor.mjs"
              - "scripts/lib/temp-workspace.mjs"
              - "scripts/lib/proposal-*.mjs"

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check formatting
        run: cargo fmt --check
        working-directory: cli
      - name: Validate release workflow contract
        run: node scripts/test-release-workflow.mjs
      - name: Validate authority mutation workflow contract
        run: node scripts/test-authority-mutations-contract.mjs
      - name: Validate authored asset parity
        run: |
          /usr/bin/env -i /usr/bin/diff -qr "${{ github.workspace }}/plugin/assets" "${{ github.workspace }}/assets"
      - name: Test CLI
        run: cargo test
        working-directory: cli
      - name: Validate cross-profile conformance
        run: |
          make validate-profile-conformance
      - name: Validate authority monotonicity corpus and registered projections
        run: make validate-authority-conformance
      - name: Validate bundled template
        run: cargo run -- --json validate --dir ../plugin/assets/templates/basic
        working-directory: cli
      - name: Eval bundled template
        run: cargo run -- --json eval --dir ../plugin/assets/templates/basic
        working-directory: cli
      - name: Validate four-skill routing and eval corpus
        run: |
          python3 -m unittest scripts/test_skill_eval_harness.py scripts/test_skill_behavioral_evals.py scripts/test_skill_packaging.py
          python3 scripts/skill-eval-harness.py --mdp-bin cli/target/debug/mdp
      - name: Validate public skills with skills-ref
        run: make validate-skill-ref

  mcp-macos:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build secure publication helper
        run: cargo build --manifest-path cli/Cargo.toml
      - name: Verify identity-bound MCP prepare publication
        run: >-
          node --test
          --test-name-pattern='maps path-backed identity-bound|completes prepare, run, and verify|prepare refuses request and manifest parent swaps'
          scripts/test-run-mcp-server.mjs
      - name: Verify typed queued cancellation over stdio
        run: |
          bash scripts/test-run-mcp-queued-cancellation.sh
          bash scripts/test-proposal-mcp-queued-cancellation.sh
      - name: Verify temporary workspace cleanup
        run: node --test scripts/test-temp-workspace.mjs

  pluxx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Pluxx
        run: |
          # MDP-221 public binding: install the registry artifact only after its
          # exact npm-published integrity matches the reviewed Pluxx 0.1.42 release.
          expected='sha512-Mw63WOao0GXFVcqNw3w4Axs1+5nQhb+wtNWJWwOy8SYwuKvlF3r4G+NSjgGd+ZEoqfS1V1gKm3nXsNPjbOtKaw=='
          pluxx_tarball="$(npm pack @orchid-labs/pluxx@0.1.42 --pack-destination "$RUNNER_TEMP" --silent)"
          pluxx_tarball_path="$RUNNER_TEMP/$pluxx_tarball"
          actual="$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$pluxx_tarball_path")"
          test "$actual" = "$expected"
          npm install -g "$pluxx_tarball_path"
      - name: Check Pluxx source health
        run: pluxx doctor
      - name: Lint Pluxx source
        run: pluxx lint
      - name: Test Pluxx bundles
        run: pluxx test
      - name: Verify generated skill bundles
        run: python3 scripts/validate-skill-packaging.py --require-bundles
      - name: Test Pluxx hook and diagnostic contracts
        run: bash scripts/test-pluxx-hooks.sh

  eve-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/ai-sdr-eve-vercel/package-lock.json
      - name: Build source MDP CLI
        run: cargo build --manifest-path cli/Cargo.toml
      - name: Add source MDP CLI to PATH
        run: echo "$GITHUB_WORKSPACE/cli/target/debug" >> "$GITHUB_PATH"
      - name: Install Eve dependencies
        run: npm ci
        working-directory: examples/ai-sdr-eve-vercel
      - name: Validate canonical Eve example
        run: npm run check
        working-directory: examples/ai-sdr-eve-vercel
